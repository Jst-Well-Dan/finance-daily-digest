name: daily

on:
  schedule:
    - cron: "0 0 * * *" # 08:00 CST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          # pi SDK 0.84.4 依赖 node:fs.globSync，需要 Node 22+；24 与本地一致
          node-version: "24"

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          node -v
          python -V

      - name: Install yt-dlp & python deps
        run: |
          pip install -U yt-dlp markdown requests
          yt-dlp --version

      - name: Install pi (local, for ESM resolution)
        run: |
          npm i --no-save @earendil-works/pi-coding-agent
          node --input-type=module -e "import('@earendil-works/pi-coding-agent')" && echo "pi SDK import ok"

      - name: Resolve daily dir
        id: ddir
        run: |
          DDIR=$(python scripts/resolve_daily_dir.py --date $(date +%Y%m%d) --ensure)
          echo "dir=$DDIR" >> $GITHUB_OUTPUT
          echo "Daily dir: $DDIR"
          cat content_paths.json

      - name: Download channel (incremental 14d window)
        id: dl
        # YouTube 对 runner 的 Azure IP 可能触发会话级反爬（SABR / PO Token 墙），
        # 单个视频 403 已由脚本容忍；若整体失败则不阻断当天后续步骤（转写/笔记/HTML 依旧跑），
        # 并在失败时建 Issue 提醒介入（配套 cookies 后即可稳定）。
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES }}
        run: |
          # 若配置了 YT_COOKIES（导出的 cookies.txt Base64），解码后供 yt-dlp 使用以绕过会话级反爬
          COOKIES_ARG=""
          if [ -n "$YT_COOKIES_B64" ]; then
            echo "$YT_COOKIES_B64" | base64 -d > "$RUNNER_TEMP/cookies.txt"
            echo "yt cookies decoded: $(wc -l < "$RUNNER_TEMP/cookies.txt") lines"
            COOKIES_ARG="--cookies $RUNNER_TEMP/cookies.txt"
          else
            echo "yt cookies: not configured (create an Issue if downloads keep failing)"
          fi
          python .pi/skills/youtube-digest/scripts/download_youtube_channel.py \
            --run-dir "${{ steps.ddir.outputs.dir }}" \
            --dateafter $(date -d "14 days ago" +%Y%m%d) \
            --datebefore $(date -d "tomorrow" +%Y%m%d) \
            --archive .pi/skills/youtube-digest/.youtube_download_archive.txt \
            $COOKIES_ARG
          echo "archive lines: $(wc -l < .pi/skills/youtube-digest/.youtube_download_archive.txt)"

      - name: Transcribe
        # 转写失败不应阻断当天发布：单条失败已由脚本降级为 status=failed，
        # 此处整体容错并打印 status-file 摘要，末尾若确有失败将触发 issue 提醒。
        continue-on-error: true
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          mkdir -p "${{ steps.ddir.outputs.dir }}"
          python .pi/skills/youtube-digest/scripts/process_video_transcripts.py \
            --run-dir "${{ steps.ddir.outputs.dir }}" \
            --transcriber .pi/skills/video-transcriber/scripts/transcribe_siliconflow.py \
            --status-file "${{ steps.ddir.outputs.dir }}/.transcribe_status.json" \
            --workers 3 || RC=$?
          echo "--- transcribe status ---"
          python -c "import json,sys; d=json.load(open('${{ steps.ddir.outputs.dir }}/.transcribe_status.json')); [print(r['status'], r.get('dir',''), (r.get('reason') or '')[:300]) for r in d['results']]" 2>&1 || cat "${{ steps.ddir.outputs.dir }}/.transcribe_status.json" || true
          exit ${RC:-0}

      - name: Configure pi auth.json (cloud provider key)
        env:
          PI_AUTH_JSON_B64: ${{ secrets.PI_AUTH_JSON_B64 }}
        run: |
          # 从 Secret 解码与本地同构的 auth.json（含 opencode-go，type=api_key），pi 以相同 provider 名解析模型
          mkdir -p "$HOME/.pi/agent"
          echo "$PI_AUTH_JSON_B64" | base64 -d > "$HOME/.pi/agent/auth.json"
          python -c "import json,os; d=json.load(open(os.path.expanduser('~/.pi/agent/auth.json'))); print('auth.json:', {k: v.get('type') for k, v in d.items()})"

      - name: Debug pi model/auth resolution
        run: |
          node --input-type=module -e "
          import { ModelRuntime, resolveCliModel } from '@earendil-works/pi-coding-agent';
          const mr = await ModelRuntime.create();
          const m = process.env.PI_MODEL;
          const r = m ? resolveCliModel({ cliModel: m, modelRuntime: mr }) : { model: null, warning: 'no PI_MODEL' };
          console.log('[pi-debug] PI_MODEL=' + (m || ''));
          console.log('[pi-debug] resolve ok=' + !!r.model + ' warn=' + (r.warning || '') + ' err=' + (r.error || '') + (r.model ? ' -> ' + r.model.provider + '/' + r.model.id : ''));
          try { console.log('[pi-debug] hasAuth(opencode-go)=' + await mr.hasConfiguredAuth('opencode-go')); } catch (e) { console.log('[pi-debug] auth check ERR: ' + e.message); }
          "

      - name: Generate structured notes via pi (provider-agnostic)
        env:
          # 配置任一可用供应商的 Key，pi 会自动择优；也可在 Repo Variables 设 PI_MODEL=provider/model 定死
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          PI_MODEL: ${{ vars.PI_MODEL }}
        run: |
          # 仅当存在新转写稿且缺笔记时才会调用 LLM；无待生成则秒退，不消耗额度
          node scripts/generate_notes_via_pi.mjs --daily-dir "${{ steps.ddir.outputs.dir }}"

      - name: Generate daily summary (deterministic copy of core conclusions)
        run: |
          # 每日总结是“原样复制核心结论”的确定性步骤，直接用 python 聚合，避免 LLM 改写漂移
          if ls "${{ steps.ddir.outputs.dir }}"/*/*_结构化笔记.md >/dev/null 2>&1; then
            python scripts/build_daily_summary.py --daily-dir "${{ steps.ddir.outputs.dir }}"
          else
            echo "no notes, skip summary"
          fi
          ls -lh "${{ steps.ddir.outputs.dir }}" || true

      - name: Build HTML (Finance Gazette style)
        run: |
          python scripts/build_reader.py
          ls -lh index.html

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/ .pi/skills/youtube-digest/.youtube_download_archive.txt index.html || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "daily: $(date +%Y-%m-%d) auto update"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Create issue on failure
        if: ${{ failure() || steps.dl.outcome == 'failure' }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "daily workflow failed: ${{ github.run_id }}"
          content-filepath: .github/ISSUE_TEMPLATE.md
          labels: automated

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
